services:

  db:
    image: postgres:16-alpine
    container_name: zhkh_db
    restart: unless-stopped
    env_file:
      - .env
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build: .
    container_name: zhkh_backend
    restart: unless-stopped
    env_file:
      - .env
    environment:
      POSTGRES_URL: postgresql+asyncpg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
      TELEGRAM_BOT_SERVICE_URL: http://telegram_bot:8081
    volumes:
      - ./ml/models:/app/ml/models
      - ./ml/artifacts:/app/ml/artifacts
      - ./ml/data/generated:/app/ml/data/generated
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy

  telegram_bot:
    build: ../CommunalServicesTGbot
    container_name: zhkh_telegram_bot
    restart: unless-stopped
    env_file:
      - .env
    environment:
      BACKEND_BASE_URL: http://backend:8000/api
      APP_BASE_URL: ${APP_BASE_URL}
      TELEGRAM_BOT_INTERNAL_SECRET: ${TELEGRAM_BOT_INTERNAL_SECRET}
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN}
    depends_on:
      - backend

volumes:
  postgres_data:
    driver: local
