services:

  db:
    image: postgres:16-alpine
    container_name: zhkh_db
    restart: unless-stopped
    env_file:
      - .env
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    logging:
      driver: syslog
      options:
        mode: non-blocking
        syslog-facility: "local0"
        tag: "zhkh/db"
        syslog-address: "tcp://rsyslog-server:514"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    image: uz3ix/zhkh-backend:v1.1.6
    container_name: zhkh_backend
    restart: unless-stopped
    env_file:
      - .env
    environment:
      POSTGRES_URL: postgresql+asyncpg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
    ports:
      - "8000:8000"
    volumes:
      - ./ml/models:/app/ml/models
      - ./ml/artifacts:/app/ml/artifacts
      - ./ml/data/generated:/app/ml/data/generated
    logging:
      driver: syslog
      options:
        mode: non-blocking
        syslog-facility: "local0"
        tag: "zhkh/backend"
        syslog-address: "tcp://rsyslog-server:514"
    depends_on:
      db:
        condition: service_healthy

  frontend:
    image: uz3ix/zhkh-frontend:v0.3.9
    container_name: zhkh_frontend
    restart: unless-stopped
    ports:
      - "8080:80"
    logging:
      driver: syslog
      options:
        mode: non-blocking
        syslog-facility: "local0"
        tag: "zhkh/frontend"
        syslog-address: "tcp://rsyslog-server:514"
    depends_on:
      - backend

  telegram_bot:
    image: uz3ix/zhkh-bot:v0.0.3
    container_name: zhkh_telegram_bot
    env_file:
      - .env
    environment:
      BACKEND_BASE_URL: http://backend:8000/api
    logging:
      driver: syslog
      options:
        mode: non-blocking
        syslog-facility: "local0"
        tag: "zhkh/tgbot"
        syslog-address: "tcp://rsyslog-server:514"
    depends_on:
      - backend
    
volumes:
  postgres_data:
    driver: local